<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>SEXTA-FEIRA — Assistente V1.0</title><style>
:root{color-scheme:dark;--gold:#70e7ff;--ink:#08090d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090d;color:#f7f0df;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#382716 0%,#17130e 28%,#08090d 68%)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#35bff512 1px,transparent 1px),linear-gradient(90deg,#35bff512 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(ellipse,#000,transparent 75%)}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 28px;z-index:5}.brand{font-size:12px;letter-spacing:.25em;color:#48cfff}.brand small{display:block;color:#716958;letter-spacing:.15em;margin-top:5px}.state{display:flex;gap:9px;align-items:center;color:#b8aa8c;font-size:10px;letter-spacing:.13em}.led{width:7px;height:7px;border-radius:50%;background:#48cfff;box-shadow:0 0 12px #8aeaff}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:78px 20px 150px}.scene{width:min(76vw,490px);aspect-ratio:1;position:relative;display:grid;place-items:center;margin-bottom:5px}.scene:before,.scene:after{content:"";position:absolute;border:1px solid #d9a84b36;border-radius:50%;inset:5%;animation:spin 28s linear infinite}.scene:before{border-style:dashed;inset:1%;border-color:#39cfff30}.scene:after{inset:12%;border-color:#70e7ff55;animation-direction:reverse;animation-duration:19s}.ring{position:absolute;border:1px solid #39cfff45;border-radius:50%;inset:19%;transform:rotateX(68deg) rotateZ(20deg);animation:orbit 12s linear infinite}.ring.r2{inset:25%;transform:rotateX(70deg) rotateZ(-35deg);animation-duration:17s;animation-direction:reverse;border-color:#a7efff5c}.core{width:43%;aspect-ratio:1;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 28%,#effdff 0%,#b1f3ff 7%,#259ce0 20%,#123c70 38%,#071725 61%,#08090d 70%);box-shadow:0 0 22px #39cfff99,0 0 65px #d88a296b,0 0 130px #1679c438;animation:breathe 4s ease-in-out infinite}.core:before{content:"";position:absolute;inset:-10%;border-radius:50%;border:2px solid #70e7ff90;box-shadow:0 0 20px #70e7ff66;animation:spin 9s linear infinite}.core:after{content:"";position:absolute;inset:10%;border-radius:50%;border:1px solid #fff0c455;box-shadow:inset 0 0 22px #57d8ff38}#particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.scene.listening .core{animation:breathe .7s ease-in-out infinite;box-shadow:0 0 35px #b1f3ff,0 0 95px #39cfffab,0 0 170px #1679c470}.scene.speaking .core{animation:breathe .45s ease-in-out infinite;filter:saturate(1.3)}
.title{text-align:center}.title h1{font-weight:400;font-size:clamp(22px,4vw,33px);letter-spacing:.17em;margin:0;text-shadow:0 0 25px #70e7ff28}.title p{font-size:10px;letter-spacing:.22em;color:#9b8865;text-transform:uppercase;margin:12px 0}.transcript{width:min(620px,100%);min-height:28px;text-align:center;color:#e7d6b4;font-size:14px;line-height:1.6;margin-top:10px}.transcript .userline{color:#887d68}.transcript .answer{color:#d9f8ff}
.controls{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:18px 20px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;background:linear-gradient(0deg,#08090df7 45%,#08090d00)}.inputrow{width:min(650px,100%);display:flex;align-items:center;gap:10px;border:1px solid #2386a53f;border-radius:18px;background:#11100de8;padding:8px;box-shadow:0 0 40px #0008;backdrop-filter:blur(18px)}input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#f7f0df;font:14px system-ui;padding:10px 12px}input::placeholder{color:#776f60}button{cursor:pointer;color:#b4f2ff;border:1px solid #238eae4a;background:#0b2432;border-radius:12px;min-width:44px;height:44px;font:inherit}button:hover{background:#10415a;border-color:#5fe0ff}button:disabled{opacity:.5;cursor:wait}.mic{width:auto;min-width:132px;padding:0 12px;white-space:nowrap;background:linear-gradient(145deg,#3bc9f5,#125b8a);color:#120d06;border:0;font-size:20px;box-shadow:0 0 22px #159bd535}.mic.active{animation:micpulse 1s infinite}.mic .mic-label{font-size:10px;letter-spacing:.04em;font-weight:700}.send{padding:0 15px;font-size:11px;letter-spacing:.06em}.foot{font-size:9px;letter-spacing:.12em;color:#645b4c;margin-top:12px;text-align:center}.history{position:fixed;z-index:10;right:20px;top:76px;width:min(390px,calc(100vw - 40px));max-height:55svh;overflow:auto;display:none;padding:14px;border:1px solid #238eae4a;border-radius:16px;background:#0d0c0bea;backdrop-filter:blur(20px)}.history.open{display:block}.bubble{padding:10px 12px;border-bottom:1px solid #ffffff10;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.5}.bubble b{display:block;color:#48cfff;font-size:10px;letter-spacing:.15em;margin-bottom:5px}.historybtn{position:fixed;top:70px;right:27px;z-index:6;font-size:10px;min-width:auto;padding:0 12px;height:34px;background:#15120d99}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes orbit{to{transform:rotateX(68deg) rotateZ(380deg)}}@keyframes breathe{0%,100%{transform:scale(.96)}50%{transform:scale(1.04)}}@keyframes micpulse{50%{box-shadow:0 0 30px #8aeaff9c}}@media(max-width:600px){.mic{min-width:48px;padding:0 8px}.mic .mic-label{display:none}header{padding:17px}.scene{width:min(88vw,400px)}main{padding-top:78px;padding-bottom:145px}.title h1{letter-spacing:.1em}.historybtn{top:65px;right:17px}.state{font-size:9px}.brand{font-size:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body>
<header><div class="brand">ASSISTENTE <strong>V1.0</strong><small>INTELIGÊNCIA • SISTEMAS • VOZ</small></div><div class="state"><span class="led" id="led"></span><span id="status">SISTEMA PRONTO</span></div></header>
<button class="historybtn" id="historyToggle" type="button">CONVERSA ↗</button><section class="history" id="history" aria-live="polite"></section>
<main><div class="scene" id="scene" aria-label="Núcleo holográfico animado"><canvas id="particles"></canvas><div class="ring"></div><div class="ring r2"></div><div class="core"></div></div><div class="title"><h1>ESTOU À DISPOSIÇÃO</h1><p>Assistente pessoal • Português brasileiro</p></div><div class="transcript" id="transcript">Toque no microfone uma vez e diga “Bom dia, Sexta-Feira”, “Boa tarde, Sexta-Feira” ou “Boa noite, Sexta-Feira”.</div></main>
<form class="controls" id="form"><div class="inputrow"><button class="mic" id="mic" type="button" title="Ativar escuta da Sexta-Feira" aria-label="Ativar escuta">🎙 <span class="mic-label">ATIVAR VOZ</span></button><input id="prompt" autocomplete="off" placeholder="Fale comigo, ou escreva aqui..." aria-label="Mensagem para o assistente"><button class="send" id="send" type="submit">ENVIAR ↗</button><button id="stop" type="button" title="Parar áudio" aria-label="Parar áudio">■</button></div><div class="foot" id="hint">VOZ ATIVA • NÃO INFORME SENHAS OU TOKENS</div></form>
<script>
const $=id=>document.getElementById(id);let recognition=null,listening=false,busy=false,wakeEnabled=false,awaitingCommand=false,speechPlaying=false,restartTimer=null;const canvas=$('particles'),ctx=canvas.getContext('2d');let dots=[];
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);dots=Array.from({length:100},()=>({a:Math.random()*Math.PI*2,r:.19+Math.random()*.36,s:.3+Math.random()*.9,z:Math.random()*2+.5,p:Math.random()*Math.PI*2}))}
function draw(t){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);for(const q of dots){q.a+=.0015*q.s;const pulse=$('scene').classList.contains('listening')?1.12:1,x=w/2+Math.cos(q.a+t*.00008*q.s)*w*q.r*.48*pulse,y=h/2+Math.sin(q.a*1.15+t*.00007*q.s)*h*q.r*.48*pulse;ctx.beginPath();ctx.fillStyle='rgba(112,231,255,'+(.18+.55*(.5+.5*Math.sin(t*.002+q.p)))+')';ctx.arc(x,y,q.z,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}
new ResizeObserver(resize).observe(canvas);resize();requestAnimationFrame(draw);
function setState(s){$('status').textContent=s;$('led').style.background=s.includes('OUVINDO')?'#ffcb69':s.includes('PENSANDO')?'#e9a74c':'#48cfff';$('scene').classList.toggle('listening',s.includes('OUVINDO'));$('scene').classList.toggle('speaking',s.includes('FALANDO'))}
function bubble(who,text){const box=document.createElement('div'),b=document.createElement('b'),span=document.createElement('div');box.className='bubble';b.textContent=who;span.textContent=text;box.append(b,span);$('history').appendChild(box);$('history').scrollTop=$('history').scrollHeight}
function showLast(who,text){$('transcript').replaceChildren();const d=document.createElement('div');d.className=who==='VOCÊ'?'userline':'answer';d.textContent=(who==='VOCÊ'?'Você: ':'Sexta-Feira: ')+text;$('transcript').appendChild(d)}
function chooseVoice(){const vs=window.speechSynthesis.getVoices();const preferred=[/Google português do Brasil/i,/Microsoft Francisca/i,/Microsoft Thalita/i,/Microsoft Bruna/i,/Microsoft Raquel/i,/Microsoft Maria/i,/Microsoft Zira/i,/Microsoft Aria/i,/Luciana/i,/Camila/i,/Vitória/i,/female.*pt-BR/i];for(const pattern of preferred){const v=vs.find(x=>pattern.test(x.name+' '+x.lang));if(v)return v}return vs.find(x=>/^pt-BR/i.test(x.lang))||vs.find(x=>/^pt/i.test(x.lang))||null}
let currentAudio=null;let currentUtterance=null;async function speak(text){try{speechPlaying=true;window.speechSynthesis?.cancel();if(currentAudio){currentAudio.pause();currentAudio=null}setState('GERANDO VOZ FEMININA');$('hint').textContent='VOZ NEURAL FEMININA • PORTUGUÊS BRASILEIRO';const res=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!res.ok){let d={};try{d=await res.json()}catch{}throw new Error([d.error,d.detail].filter(Boolean).join(' — ')||'Não foi possível gerar a voz feminina.')}const audioBlob=await res.blob();const audioUrl=URL.createObjectURL(audioBlob);currentAudio=new Audio(audioUrl);currentAudio.volume=0.45;currentAudio.onplay=()=>setState('FALANDO');currentAudio.onended=()=>{URL.revokeObjectURL(audioUrl);currentAudio=null;speechPlaying=false;setState(wakeEnabled?'AGUARDANDO SEXTA-FEIRA':'SISTEMA PRONTO');if(wakeEnabled){clearTimeout(restartTimer);restartTimer=setTimeout(startWakeListening,650)}};currentAudio.onerror=()=>{URL.revokeObjectURL(audioUrl);currentAudio=null;setState('ERRO NA VOZ');$('hint').textContent='Falha ao reproduzir o áudio.'};await currentAudio.play()}catch(e){speechPlaying=false;setState('ERRO NA VOZ');$('hint').textContent=e.message||'Não foi possível gerar a voz feminina.';if(wakeEnabled){clearTimeout(restartTimer);restartTimer=setTimeout(startWakeListening,900)}}}async function send(text){text=text.trim();if(!text||busy)return;busy=true;bubble('VOCÊ',text);showLast('VOCÊ',text);$('prompt').value='';$('send').disabled=true;setState('PENSANDO');try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error([data.error,data.detail].filter(Boolean).join(' — ')||'O serviço de IA não respondeu.');const answer=data.reply||'Não recebi uma resposta válida.';bubble('SEXTA-FEIRA',answer);showLast('SEXTA-FEIRA',answer);speak(answer)}catch(e){const msg=e.message||'Falha de conexão com o servidor.';$('hint').textContent='Erro ao responder: '+msg;bubble('SISTEMA',msg);showLast('SISTEMA',msg);setState('VERIFIQUE A CONEXÃO')}finally{busy=false;$('send').disabled=false}}
$('form').addEventListener('submit',e=>{e.preventDefault();send($('prompt').value)});
function normalizeSpeech(s){return s.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function startWakeListening(){
 if(!wakeEnabled||busy||speechPlaying||listening)return;
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){wakeEnabled=false;$('hint').textContent='Este navegador não oferece reconhecimento de voz compatível. Permita o microfone e tente novamente.';setState('SISTEMA PRONTO');return}
 recognition=new SR();recognition.lang='pt-BR';recognition.interimResults=true;recognition.continuous=true;recognition.maxAlternatives=1;
 let handled=false;
 recognition.onstart=()=>{listening=true;$('mic').classList.add('active');$('mic').innerHTML='● <span class="mic-label">ESCUTANDO</span>';$('hint').textContent=awaitingCommand?'ESCUTANDO SUA MENSAGEM • SEXTA-FEIRA':'DIGA BOM DIA, BOA TARDE OU BOA NOITE, SEXTA-FEIRA';setState(awaitingCommand?'OUVINDO SUA MENSAGEM':'AGUARDANDO SEXTA-FEIRA')};
 recognition.onresult=e=>{
  let interim='';
  for(let i=e.resultIndex;i<e.results.length;i++){
   const raw=e.results[i][0].transcript.trim();
   if(!e.results[i].isFinal){interim+=raw+' ';continue}
   if(handled)continue;
   const clean=normalizeSpeech(raw);
   const wake=clean.match(/\b(bom dia|boa tarde|boa noite|ola|oi)\s+sexta feira\b/);
   if(wake){
    handled=true;
    const greeting=wake[0];
    const rest=clean.slice(wake.index+wake[0].length).trim();
    awaitingCommand=!rest;
    if(rest) { $('prompt').value=rest; }
    try{recognition.stop()}catch{}
    send(rest?rest:greeting);
   } else if(awaitingCommand&&clean){
    handled=true;awaitingCommand=false;
    try{recognition.stop()}catch{}
    send(raw);
   }
  }
  if(interim.trim()){$('prompt').value=interim.trim();showLast('VOCÊ',interim.trim())}
 };
 recognition.onerror=e=>{
  if(e.error==='not-allowed'||e.error==='service-not-allowed'){wakeEnabled=false;$('hint').textContent='Permissão do microfone bloqueada. Clique no cadeado ao lado do endereço e permita o microfone.'}
  else if(e.error!=='no-speech'&&e.error!=='aborted')$('hint').textContent='Reconhecimento de voz: '+e.error;
 };
 recognition.onend=()=>{
  listening=false;$('mic').classList.remove('active');$('mic').innerHTML='🎙 <span class="mic-label">ATIVAR VOZ</span>';
  if(wakeEnabled&&!busy&&!speechPlaying){clearTimeout(restartTimer);restartTimer=setTimeout(startWakeListening,500)}
  else if(!wakeEnabled)setState('SISTEMA PRONTO');
 };
 try{recognition.start()}catch(e){listening=false;clearTimeout(restartTimer);restartTimer=setTimeout(()=>{if(wakeEnabled&&!listening)startWakeListening()},900)}
}
$('mic').addEventListener('click',()=>{
 if(wakeEnabled){wakeEnabled=false;awaitingCommand=false;clearTimeout(restartTimer);if(recognition&&listening){try{recognition.stop()}catch{}}$('mic').classList.remove('active');$('mic').textContent='🎙';$('hint').textContent='ESCUTA DESATIVADA • NÃO INFORME SENHAS OU TOKENS';setState('SISTEMA PRONTO');return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$('hint').textContent='O reconhecimento de voz não está disponível neste navegador. Atualize o Opera GX e permita o microfone.';return}
 wakeEnabled=true;awaitingCommand=false;$('hint').textContent='Solicitando acesso ao microfone…';startWakeListening();
});
$('stop').addEventListener('click',()=>{wakeEnabled=false;awaitingCommand=false;clearTimeout(restartTimer);if(recognition&&listening)recognition.stop();speechPlaying=false;if('speechSynthesis'in window)window.speechSynthesis.cancel();if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null}currentUtterance=null;setState('SISTEMA PRONTO');$('hint').textContent='ESCUTA PARADA';});$('historyToggle').addEventListener('click',()=>$('history').classList.toggle('open'));
</script></body></html>
